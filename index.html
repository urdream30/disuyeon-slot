<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffca1c"><title>경기도디지털활용수업사례연구회 2024 슬롯머신</title>
<style>
:root{font-family:system-ui,'Noto Sans KR',sans-serif;color:#171717;background:#f6f3e9}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overscroll-behavior:none}body{min-height:100dvh}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #ed6890;outline-offset:5px}.screen{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:18px}.screen[hidden]{display:none!important}.frame{width:min(100%,1250px);min-height:min(660px,calc(100dvh - 36px));background:#ffca1c;border:5px solid #171717;box-shadow:10px 10px 0 #171717;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;overflow:hidden;text-align:center}.brand{position:absolute;top:17px;left:22px;right:140px;text-align:left;font-size:clamp(13px,2.1vw,25px);font-weight:1000;letter-spacing:-1px;word-break:keep-all;line-height:1.2}.since{position:absolute;top:20px;right:20px;background:#171717;color:white;padding:7px 12px;font-weight:900;font-size:clamp(10px,1.5vw,15px);transform:rotate(3deg)}.bulb{font-size:clamp(60px,11vh,100px);line-height:1.2;filter:drop-shadow(5px 5px 0 #171717);margin-bottom:20px}.mission{font-size:clamp(24px,4.7vw,62px);font-weight:1000;line-height:1.25;letter-spacing:-1.8px;margin:0 0 32px;word-break:keep-all}.startBtn,.retryBtn{border:4px solid #171717;background:#fff;color:#171717;box-shadow:8px 8px 0 #171717;font-size:clamp(24px,4vw,44px);font-weight:1000;padding:15px 65px;min-height:75px}.startBtn:active,.retryBtn:active{transform:translate(5px,5px);box-shadow:3px 3px 0 #171717}.instruction{font-size:clamp(13px,1.8vw,20px);font-weight:800;margin-top:27px}.gameFrame{background:#f8f5eb;touch-action:manipulation;user-select:none;-webkit-user-select:none}.gameTitle{font-weight:1000;font-size:clamp(18px,2.8vw,35px);margin:0 0 20px}.reels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,1.5vw,18px);width:min(100%,1070px);padding:clamp(7px,1.2vw,16px);border:5px solid #171717;background:#171717;box-shadow:8px 8px 0 #ffca1c}.reel{background:#fff;min-width:0;height:clamp(130px,38vh,320px);display:flex;align-items:center;justify-content:center;font-size:clamp(78px,23vh,235px);font-weight:1000;line-height:1;font-variant-numeric:tabular-nums}.reel.active{background:#ffca1c}.reel.correct{background:#a9efba}.reel.wrong{background:#ffd3dc}.status{font-size:clamp(18px,2.4vw,30px);font-weight:950;min-height:45px;margin:30px 0 5px}.help{font-size:clamp(13px,1.7vw,19px);font-weight:700;color:#444}.resultFrame{background:#ffca1c}.resultText{font-size:clamp(26px,5vw,64px);font-weight:1000;margin:5px 0 20px}.resultDigits{font-size:clamp(62px,13vw,165px);font-weight:1000;line-height:1;letter-spacing:.05em;margin:0 0 15px}.resultDetail{font-size:clamp(18px,2.5vw,30px);font-weight:800;margin:0 0 28px}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-25px;width:13px;height:20px;animation:fall 2.5s linear infinite}@keyframes fall{to{transform:translateY(105vh) rotate(620deg)}}@media (orientation:portrait){.frame{min-height:calc(100dvh - 36px)}.reel{height:clamp(110px,22vh,230px);font-size:clamp(58px,15vw,170px)}.mission{font-size:clamp(26px,7vw,50px)}}@media(max-height:450px) and (orientation:landscape){.frame{min-height:calc(100dvh - 20px);padding:12px}.screen{padding:10px}.brand,.since{top:8px}.brand{font-size:clamp(12px,2.1vw,21px);right:110px}.bulb{font-size:46px;margin-bottom:8px}.mission{font-size:clamp(22px,4vw,40px);margin-bottom:14px}.startBtn,.retryBtn{min-height:48px;padding:7px 42px;font-size:25px}.instruction{margin-top:12px}.gameTitle{margin-bottom:9px}.reel{height:clamp(90px,35vh,170px);font-size:clamp(68px,28vh,135px)}.status{margin:13px 0 0;font-size:19px}.resultDigits{font-size:clamp(60px,20vh,110px)}.resultText{font-size:30px;margin:0 0 5px}.resultDetail{font-size:16px;margin-bottom:15px}}

/* 둥글고 부드러운 슬롯머신 테마 */
.resultDetail[hidden]{display:none!important}
:root{background:#fff9ee;color:#292526}
.screen{background:radial-gradient(circle at 15% 20%,#fff1bd 0,transparent 34%),#fff9ee}
.frame{
  background:#ffe18b;border:3px solid #39312e;border-radius:36px;
  box-shadow:0 14px 32px rgba(87,65,32,.15);
}
.brand{letter-spacing:-.6px;color:#39312e}
.since{background:#fff;border:2px solid #39312e;color:#39312e;
  border-radius:999px;transform:none;padding:9px 15px}
.bulb{filter:drop-shadow(0 8px 12px rgba(109,79,0,.18))}
.startBtn,.retryBtn{
  border:3px solid #39312e;border-radius:999px;
  background:#fff;color:#292526;
  box-shadow:0 8px 0 #e3aa53;
  transition:transform .12s,box-shadow .12s;
}
.startBtn:active,.retryBtn:active{transform:translateY(5px);box-shadow:0 3px 0 #e3aa53}
.gameFrame{background:#fffaf1}
.reels{
  border:0;border-radius:30px;background:#f4dfb8;
  padding:clamp(8px,1.2vw,16px);gap:clamp(8px,1.5vw,18px);
  box-shadow:0 9px 22px rgba(87,65,32,.14);
}
.reel{border-radius:22px;background:#fff;box-shadow:inset 0 3px 8px rgba(0,0,0,.04)}
.reel.active{background:#ffe18b}
.reel.correct{background:#c7efd2}
.reel.wrong{background:#ffdae3}
.resultFrame{background:#ffe18b}
.help{color:#71675e}
@media(max-width:600px){.frame{border-radius:23px}.reels{border-radius:20px}.reel{border-radius:13px}}

</style></head>
<body>
<section id="intro" class="screen"><div class="frame"><div class="brand">경기도디지털활용수업사례연구회</div><div class="since">SINCE 2024</div><div class="bulb" aria-hidden="true">💡</div><h1 class="mission">디수연의 시작년도(2024)를 맞춰라!</h1><button id="start" class="startBtn">▶ START</button><div class="instruction">화면을 터치하거나 SPACE 키로 숫자를 멈춰요</div></div></section>
<section id="game" class="screen" hidden><div class="frame gameFrame" id="gameFrame"><div class="brand">경기도디지털활용수업사례연구회</div><div class="since">SINCE 2024</div><h2 class="gameTitle">2024를 맞춰라!</h2><div class="reels" aria-label="슬롯머신 숫자"><div class="reel">0</div><div class="reel">0</div><div class="reel">0</div><div class="reel">0</div></div><div id="status" class="status" aria-live="polite">1번째 숫자를 멈춰주세요!</div><div class="help">화면 아무 곳이나 터치 · SPACE 키</div></div></section>
<section id="result" class="screen" hidden><div class="frame resultFrame"><div class="brand">경기도디지털활용수업사례연구회</div><div class="since">SINCE 2024</div><div id="confetti" class="confetti"></div><div class="bulb" id="resultBulb" aria-hidden="true">💡</div><div id="resultText" class="resultText"></div><div id="resultDigits" class="resultDigits"></div><div id="resultDetail" class="resultDetail"></div><button id="retry" class="retryBtn">↻ RETRY</button></div></section>
<script>
(()=>{'use strict';const intro=document.getElementById('intro'),game=document.getElementById('game'),result=document.getElementById('result'),start=document.getElementById('start'),retry=document.getElementById('retry'),reels=[...document.querySelectorAll('.reel')],status=document.getElementById('status');const speeds=[500,350,250,150],goal=[2,0,2,4];let nums=[0,0,0,0],index=-1,timers=[],lastStop=0;
function show(which){intro.hidden=which!=='intro';game.hidden=which!=='game';result.hidden=which!=='result'}
function draw(){reels.forEach((el,i)=>{el.textContent=nums[i];el.classList.toggle('active',i===index);el.classList.toggle('correct',i<index&&nums[i]===goal[i]);el.classList.toggle('wrong',i<index&&nums[i]!==goal[i])})}
function begin(){timers.forEach(clearInterval);timers=[];nums=[0,0,0,0];index=0;lastStop=performance.now();show('game');status.textContent='1번째 숫자를 멈춰주세요!';draw();timers=speeds.map((ms,i)=>setInterval(()=>{nums[i]=(nums[i]+1)%10;draw()},ms))}
function finish(){const win=nums.join('')==='2024';index=4;draw();document.getElementById('resultText').textContent=win?'🎉 SUCCESS!':'다시 도전해 보세요!';document.getElementById('resultDigits').textContent=nums.join('');document.getElementById('resultDetail').textContent=win?'':goal.filter((n,i)=>n===nums[i]).length+'자리 정답!';document.getElementById('resultDetail').hidden=win;const confetti=document.getElementById('confetti');confetti.replaceChildren();if(win){for(let i=0;i<35;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=['#fff','#171717','#f58ba8','#8fe6d3'][i%4];p.style.animationDelay=Math.random()*2+'s';confetti.append(p)}}show('result')}
function stop(){if(game.hidden||index<0||index>3)return;const now=performance.now();if(now-lastStop<160)return;lastStop=now;clearInterval(timers[index]);index++;if(index===4)finish();else{status.textContent=(index+1)+'번째 숫자를 멈춰주세요!';draw()}}
start.addEventListener('click',e=>{e.stopPropagation();begin()});retry.addEventListener('click',e=>{e.stopPropagation();timers.forEach(clearInterval);timers=[];index=-1;show('intro')});game.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;stop()});document.addEventListener('keydown',e=>{if(e.code!=='Space'||e.repeat||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;e.preventDefault();if(!intro.hidden){begin()}else if(!game.hidden){stop()}else if(!result.hidden){timers.forEach(clearInterval);timers=[];index=-1;show('intro')}});show('intro')})();
</script></body></html>
